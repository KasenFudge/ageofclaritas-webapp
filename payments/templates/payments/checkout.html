{% extends 'layouts/full_layout.html' %}

{% load static %}

{% block title_tag %}
  Age of Claritas - Secure Checkout
{% endblock title_tag %}

{% block content %}
  <div class="max-w-lg mx-auto px-4 py-16">
    <div class="rounded-3xl bg-white shadow-xl ring-1 ring-slate-200/80 p-8">
      <h1 class="text-2xl font-serif font-bold text-center text-slate-900 mb-6">Secure Checkout</h1>

      <div class="rounded-xl border border-slate-200 bg-slate-50 p-4 mb-6">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Settlement Summary</h2>
        <p class="font-bold text-slate-900">Total Due: ${{ amount_display }}</p>
        <p class="text-sm text-slate-500 mt-1">Clearing outstanding registration balances.</p>
      </div>

      <form id="payment-form">
        <div id="payment-element" class="mb-4"></div>

        <div id="error-message" class="hidden mb-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" role="alert"></div>

        <button id="submit-button"
                type="submit"
                class="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-navy-700 hover:bg-navy-800 text-white font-bold py-3 text-sm shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-navy-500 focus:ring-offset-2 disabled:opacity-60 disabled:cursor-not-allowed">
          <span id="button-text">Pay ${{ amount_display }} Now</span>
          <svg id="spinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <script src="https://js.stripe.com/v3/"></script>
  <script>
    // 1. Pass the configuration tokens compiled by your Django view context layer securely
    const stripeKey = "{{ stripe_publishable_key }}";
    const clientSecret = "{{ client_secret }}";

    // Initialize Stripe JS Client Core instance
    const stripe = Stripe(stripeKey);

    // 2. Initialize the Payment Elements interface matching your intent profile configuration
    const options = { clientSecret: clientSecret };
    const elements = stripe.elements(options);

    // Create and mount the secure payment UI fields block container inside our HTML element target
    const paymentElement = elements.create('payment');
    paymentElement.mount('#payment-element');

    // 3. Handle Form Submission Events
    const form = document.getElementById('payment-form');
    const submitButton = document.getElementById('submit-button');
    const buttonText = document.getElementById('button-text');
    const spinner = document.getElementById('spinner');
    const errorDiv = document.getElementById('error-message');

    form.addEventListener('submit', async (event) => {
      event.preventDefault(); // Prevent page refresh behavior

      // UI State Updates: Lock button to prevent double-charging race conditions
      submitButton.disabled = true;
      buttonText.textContent = "Processing Payment...";
      spinner.classList.remove('hidden');
      errorDiv.classList.add('hidden');

      // Execute asynchronous verification validation routing sequence via Stripe secure servers
      const { error } = await stripe.confirmPayment({
        elements,
        confirmParams: {
          // Return URL redirect path targeting successful verification pipelines
          return_url: `${window.location.origin}/payments/success/`,
        },
      });

      // This section will ONLY execute if an instantaneous client-side error occurs (e.g., declined cards)
      if (error) {
        submitButton.disabled = false;
        buttonText.textContent = "Pay ${{ amount_display }} Now";
        spinner.classList.add('hidden');

        errorDiv.textContent = error.message;
        errorDiv.classList.remove('hidden');
      }
    });
  </script>
{% endblock content %}
