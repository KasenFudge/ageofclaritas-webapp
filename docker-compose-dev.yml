services:
  db:
    container_name: kasenfudge_db
    image: postgres:16-alpine
    restart: always
    volumes:
      - kasenfudge_data:/var/lib/postgresql/data/
    networks:
      - kasenfudge_net
    env_file:
      - .env

  webapp:
    container_name: kasenfudge_webapp
    build: 
      context: .
      dockerfile: Dockerfile
    command: gunicorn ageofclaritas.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - /var/www/static/aoc:/var/www/static/aoc
      - /var/www/media/aoc:/var/www/media/aoc
    restart: always
    networks:
      - kasenfudge_net
      - web_gateway
    env_file:
      - .env
    depends_on:
      - db

  cleanup:
    container_name: kasenfudge_cleanup
    build:
      context: .
      dockerfile: Dockerfile
    # Sweeps out unverified/spam registrations every 30 min;
    command: sh -c "while true; do python manage.py delete_unverified_accounts; sleep 1800; done"
    volumes:
      - .:/app
    restart: always
    networks:
      - kasenfudge_net
    env_file:
      - .env
    depends_on:
      - db

volumes:
  kasenfudge_data:
    name: kasenfudge_data

networks:
  kasenfudge_net:
    driver: bridge
  web_gateway:
    external: true