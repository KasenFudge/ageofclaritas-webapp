services:
  db:
    container_name: ageofclaritas_db
    image: postgres:16-alpine
    restart: always
    volumes:
      - ageofclaritas_data:/var/lib/postgresql/data/
    networks:
      - ageofclaritas_net
    env_file:
      - .env

  webapp:
    container_name: ageofclaritas_webapp
    build: 
      context: .
      dockerfile: Dockerfile
    command: gunicorn ageofclaritas.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - /var/www/static/aoc:/var/www/static/aoc
      - /var/www/media/aoc:/var/www/media/aoc
    restart: always
    networks:
      - ageofclaritas_net
      - web_gateway
    env_file:
      - .env
    depends_on:
      - db

volumes:
  ageofclaritas_data:
    name: ageofclaritas_data

networks:
  ageofclaritas_net:
    driver: bridge
  web_gateway:
    external: true