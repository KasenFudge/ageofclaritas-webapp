{% load static %}

<section id="attributes" class="pt-8 border-t border-slate-200 space-y-6 scroll-mt-24">

  <h2 class="text-2xl sm:text-3xl font-serif font-bold text-center text-slate-900">Attributes</h2>

  <p class="text-slate-600 leading-relaxed">
    The Attributes a Player has access to are determined by their
    <a href="{% url 'rulebook:kin' %}" class="text-indigo-700 underline decoration-indigo-300 hover:text-indigo-900 hover:decoration-indigo-500 transition-colors">Kin</a>. Players may select one to start

  <img src="{% static 'images/Attributes.jpg' %}" class="w-full max-w-2xl mx-auto rounded-xl border border-slate-200 shadow-sm" alt="Diagram illustrating character Attributes." />
