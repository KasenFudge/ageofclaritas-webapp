{% extends 'layouts/full_layout.html' %}

{% block content %}
  <div class="max-w-md mx-auto px-4 py-16">
    <div class="rounded-3xl bg-white shadow-xl ring-1 ring-slate-200/80 p-8 sm:p-10 text-center">
      <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-full bg-green-100 text-green-700">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
          <polyline points="22 4 12 14.01 9 11.01" />
        </svg>
      </div>
      <h1 class="text-2xl font-serif font-bold text-slate-900 mb-4">Registration Successful!</h1>
      <p class="text-sm text-center text-slate-600 mb-8 leading-relaxed">Please check your email to verify your account.</p>

      <!-- The Resend Form -->
      <form action="{% url 'accounts:resend_verification' %}" method="post" class="mt-8 border-t border-slate-100 pt-6">
        {% csrf_token %}
        <input type="hidden" name="email" value="{{ user_email }}" />
        <p class="text-xs text-slate-400 mb-4">Didn't receive the email?</p>
        <button type="submit" class="w-full rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-900 font-bold py-3 text-sm uppercase tracking-wide transition-colors">Resend Verification Email</button>
      </form>
    </div>
  </div>
{% endblock content %}
