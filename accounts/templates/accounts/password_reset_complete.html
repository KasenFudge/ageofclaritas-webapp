{% extends 'layouts/full_layout.html' %}

{% block title_tag %}
  Age of Claritas - Password Updated
{% endblock title_tag %}

{% block content %}
  <div class="max-w-md mx-auto px-4 py-16">
    <div class="rounded-3xl bg-white shadow-xl ring-1 ring-slate-200/80 p-8 sm:p-10 text-center">
      <div class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-full bg-green-100 text-green-700">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
          <path d="m9 11 3 3L22 4" />
        </svg>
      </div>

      <h1 class="text-2xl font-serif font-bold uppercase tracking-wide text-slate-900 mb-4">Password Updated</h1>
      <p class="text-sm text-slate-600 mb-8">Your password has been successfully reset. You may now log in with your new credentials.</p>

      <a href="{% url 'login' %}" class="block w-full rounded-xl bg-navy-700 hover:bg-navy-800 text-white font-bold py-3 text-sm uppercase tracking-wide shadow-sm transition-colors text-center">Log In Now</a>
    </div>
  </div>
{% endblock content %}
